
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXHIBIT P | Payment Integrity Platform</title>
</head>

<body>
<h1>EXHIBIT P</h1>

<p>The Receipt Is Evidence. Not The Verdict.</p>

<p>Intelligent Payment Receipt Integrity Assessment.</p>

    <h2>Verify a Payment</h2>

    <form action="/verify" method="POST">

        <label for="reference">Transaction Reference:</label>
        <input
            type="text"
            id="reference"
            name="reference"
            required
        >

        <br><br>

        <label for="amount">Amount (e.g. 2500.00):</label>
        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0.01"
            required
        >

        <br><br>

        <label for="currency">Currency:</label>
        <select id="currency" name="currency" required>
            <option value="KES">KES</option>
            <option value="NGN">NGN</option>
            <option value="USD">USD</option>
        </select>

        <br><br>

        <label for="merchant_id">Merchant ID:</label>
        <input
            type="text"
            id="merchant_id"
            name="merchant_id"
            required
        >

        <br><br>

        <button type="submit">Verify Payment</button>

    </form>

    {% if result %}
        <h2>Verification Result</h2>
        <p><strong>Status:</strong> {{ result.result }}</p>
        <p><strong>Message:</strong> {{ result.message }}</p>
    {% endif %}

</body>
</html>
